<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools - Admin</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Avenir:wght@400;500;600;700&display=swap');
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Avenir', sans-serif;
      background: linear-gradient(135deg, #f5faeb 0%, #d3f4ea 100%);
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .header {
      background: linear-gradient(135deg, #1d524a 0%, #2d9f88 100%);
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .header-right {
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .header a {
      color: white;
      text-decoration: none;
      padding: 8px 15px;
      background: rgba(255,255,255,0.2);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
    }
    .header a:hover {
      background: rgba(255,255,255,0.3);
    }
    .logout {
      background: rgba(220, 38, 38, 0.8) !important;
    }
    .logout:hover {
      background: rgba(220, 38, 38, 1) !important;
    }
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e7f4d3;
      padding-bottom: 0;
    }
    .tab {
      padding: 12px 24px;
      background: white;
      border: 2px solid #e7f4d3;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #5c8c24;
      font-family: inherit;
    }
    .tab.active {
      background: #2d9f88;
      color: white;
      border-color: #2d9f88;
    }
    .toolbar {
      margin-bottom: 20px;
    }
    .btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, #78b032 0%, #5c8c24 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(120, 176, 50, 0.4);
    }
    .btn-sync {
      background: linear-gradient(135deg, #2d9f88 0%, #227f6f 100%);
      margin-left: 10px;
    }
    .btn-sync:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(45, 159, 136, 0.4);
    }
    .btn-sync:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .table-wrapper {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(45, 159, 136, 0.1);
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 14px 16px;
      border-bottom: 1px solid #e7f4d3;
    }
    th {
      background: #f5faeb;
      font-weight: 600;
      color: #1d524a;
      font-size: 14px;
    }
    tr:hover {
      background: #f2fbf8;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn-small {
      padding: 6px 12px;
      font-size: 12px;
    }
    .btn-edit {
      background: linear-gradient(135deg, #2d9f88 0%, #227f6f 100%);
    }
    .btn-delete {
      background: rgba(220, 38, 38, 0.8);
    }
    .btn-delete:hover {
      background: rgba(220, 38, 38, 1);
    }
    .user-info {
      color: rgba(255,255,255,0.8);
      font-size: 14px;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #5c8c24;
    }
    .empty {
      text-align: center;
      padding: 40px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="display:flex;align-items:center;gap:15px;">
      <img src="/assets/logos/logo-color.png" alt="DSP" style="height:32px;">
      <h1>Admin - Tools</h1>
    </div>
    <div class="header-right">
      <span class="user-info" id="userInfo"></span>
      <a href="/admin/translations" id="translationsLink" style="display:none">UI Translations</a>
      <a href="/admin/users" id="usersLink" style="display:none">Manage Users</a>
      <a href="#" class="logout" id="logoutBtn">Logout</a>
    </div>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="tab active" data-lang="en">English</button>
      <button class="tab" data-lang="es">Spanish</button>
      <button class="tab" data-lang="de">German</button>
      <button class="tab" data-lang="el">Greek</button>
    </div>

    <div class="toolbar">
      <button class="btn" id="createBtn">+ Create New Tool</button>
      <button class="btn btn-sync" id="syncBtn" style="display:none">Push to GitHub</button>
    </div>

    <div class="table-wrapper">
      <div class="loading" id="loading">Loading...</div>
      <div class="empty" id="empty" style="display:none">No tools found</div>
      <table id="toolsTable" style="display:none">
        <thead>
          <tr>
            <th style="width:60px">#</th>
            <th>Name</th>
            <th>Purpose</th>
            <th style="width:100px">Partner</th>
            <th style="width:150px">Actions</th>
          </tr>
        </thead>
        <tbody id="toolsBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const LANG_NAMES = { en: 'English', es: 'Spanish', de: 'German', el: 'Greek' };
    let currentLang = 'en';
    let currentUser = null;

    // Check auth
    async function checkAuth() {
      const res = await fetch('/api/auth/me');
      if (!res.ok) {
        window.location.href = '/admin';
        return null;
      }
      const data = await res.json();
      currentUser = data.user;
      document.getElementById('userInfo').textContent = data.user.username + ' (' + data.user.role + ')';
      if (data.user.role === 'admin') {
        document.getElementById('usersLink').style.display = 'block';
        document.getElementById('translationsLink').style.display = 'block';
        document.getElementById('syncBtn').style.display = 'inline-block';
      } else {
        document.getElementById('syncBtn').style.display = 'none';
      }
      return data.user;
    }

    // Load tools for language
    async function loadTools(lang) {
      const loading = document.getElementById('loading');
      const empty = document.getElementById('empty');
      const table = document.getElementById('toolsTable');
      
      loading.style.display = 'block';
      empty.style.display = 'none';
      table.style.display = 'none';

      try {
        const res = await fetch(`/api/tools/${lang}`);
        if (res.status === 401) {
          window.location.href = '/admin';
          return;
        }
        const data = await res.json();
        
        loading.style.display = 'none';
        
        if (!data.tools || data.tools.length === 0) {
          empty.style.display = 'block';
          return;
        }
        
        table.style.display = 'table';
        
        const tbody = document.getElementById('toolsBody');
        tbody.innerHTML = data.tools.map(tool => `
          <tr>
            <td>${tool.number}</td>
            <td>${escapeHtml(tool.name)}</td>
            <td>${escapeHtml(tool.purpose || '-')}</td>
            <td>${escapeHtml(tool.partner || '-')}</td>
            <td class="actions">
              <a href="/admin/tools/${lang}/${encodeURIComponent(tool.filename)}" class="btn btn-small btn-edit">Edit</a>
              <button class="btn btn-small btn-delete" onclick="deleteTool('${lang}', '${escapeHtml(tool.filename)}')">Delete</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        loading.textContent = 'Error loading tools';
      }
    }

    // Delete tool
    async function deleteTool(lang, filename) {
      if (!confirm('Are you sure you want to delete this tool?')) return;
      
      try {
        const res = await fetch(`/api/tools/${lang}/${encodeURIComponent(filename)}`, {
          method: 'DELETE'
        });
        
        if (res.status === 401) {
          window.location.href = '/admin';
          return;
        }
        
        if (res.ok) {
          loadTools(lang);
        } else {
          alert('Error deleting tool');
        }
      } catch (err) {
        alert('Error deleting tool');
      }
    }

    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentLang = tab.dataset.lang;
        loadTools(currentLang);
      });
    });

    // Create button
    document.getElementById('createBtn').addEventListener('click', () => {
      window.location.href = `/admin/tools/${currentLang}/new`;
    });

    // Sync to GitHub
    document.getElementById('syncBtn').addEventListener('click', async () => {
      const btn = document.getElementById('syncBtn');
      btn.disabled = true;
      btn.textContent = 'Pushing...';
      
      try {
        const res = await fetch('/api/sync', { method: 'POST' });
        if (res.status === 401) {
          window.location.href = '/admin';
          return;
        }
        const data = await res.json();
        
        if (data.success) {
          alert('✅ Changes pushed to GitHub!\n\nA new build will be triggered automatically.');
        } else if (data.synced === false) {
          alert('ℹ️ No changes to commit.');
        } else {
          alert('⚠️ ' + (data.error || 'Sync failed'));
        }
      } catch (err) {
        alert('❌ Sync failed: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Push to GitHub';
      }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/admin';
    });

    // Init
    checkAuth().then(user => {
      if (user) loadTools('en');
    });
  </script>
</body>
</html>
