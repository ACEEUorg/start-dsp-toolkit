<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - DSP Toolkit Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Avenir:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Avenir', sans-serif;
      background: linear-gradient(135deg, #f5faeb 0%, #d3f4ea 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(45, 159, 136, 0.15);
      width: 100%;
      max-width: 420px;
    }
    .logo {
      display: block;
      margin: 0 auto 30px;
      max-width: 200px;
      height: auto;
    }
    h1 { margin: 0 0 10px; color: #1d524a; font-size: 24px; font-weight: 600; text-align: center; }
    p { color: #666; margin: 0 0 30px; line-height: 1.5; text-align: center; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; color: #1d524a; font-weight: 500; font-size: 14px; }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e7f4d3;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus { outline: none; border-color: #2d9f88; box-shadow: 0 0 0 3px rgba(45, 159, 136, 0.1); }
    .error, .success { padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; font-size: 14px; }
    .error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }
    .success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #78b032 0%, #5c8c24 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(120, 176, 50, 0.4); }
    button:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/assets/logos/logo-color.png" alt="Start-DSP Toolkit" class="logo">
    <h1>Set New Password</h1>
    <p>Enter your new password (minimum 8 characters).</p>
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
    <form id="form">
      <div class="form-group">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" minlength="8" required>
      </div>
      <div class="form-group">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" name="confirm" minlength="8" required>
      </div>
      <button type="submit" id="submitBtn">Reset Password</button>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      document.body.innerHTML = '<div class="box"><img src="/assets/logos/logo-color.png" alt="DSP" class="logo"><h1>Invalid Link</h1><p>This password reset link is invalid or has expired.</p></div>';
    }

    const form = document.getElementById('form');
    const errorEl = document.getElementById('error');
    const successEl = document.getElementById('success');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match';
        errorEl.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error);
        }

        successEl.textContent = 'Password reset successful! Redirecting to login...';
        successEl.style.display = 'block';
        form.style.display = 'none';
        setTimeout(() => window.location.href = '/admin', 2000);
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
