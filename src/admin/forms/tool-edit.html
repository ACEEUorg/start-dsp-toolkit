<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Tool - Admin</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Avenir:wght@400;500;600;700&display=swap');
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Avenir', sans-serif;
      background: linear-gradient(135deg, #f5faeb 0%, #d3f4ea 100%);
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .header {
      background: linear-gradient(135deg, #1d524a 0%, #2d9f88 100%);
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .header a {
      color: white;
      text-decoration: none;
      padding: 8px 15px;
      background: rgba(255,255,255,0.2);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
    }
    .header a:hover {
      background: rgba(255,255,255,0.3);
    }
    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .form-card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(45, 159, 136, 0.1);
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #1d524a;
      font-size: 14px;
    }
    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e7f4d3;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #2d9f88;
      box-shadow: 0 0 0 3px rgba(45, 159, 136, 0.1);
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 2px solid #e7f4d3;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #78b032 0%, #5c8c24 100%);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(120, 176, 50, 0.4);
    }
    .btn-secondary {
      background: #e7f4d3;
      color: #5c8c24;
    }
    .btn-secondary:hover {
      background: #d2ebab;
    }
    .btn-danger {
      background: rgba(220, 38, 38, 0.8);
      color: white;
    }
    .btn-danger:hover {
      background: rgba(220, 38, 38, 1);
    }
    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .success a {
      color: #0066cc;
      font-weight: 500;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #0066cc;
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .links-container {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      background: #fafafa;
    }
    .link-row {
      display: grid;
      grid-template-columns: 1fr 2fr auto;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }
    .link-row:last-child {
      margin-bottom: 0;
    }
    .add-link {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="display:flex;align-items:center;gap:15px;">
      <img src="/assets/logos/logo-color.png" alt="DSP" style="height:32px;">
      <h1 id="pageTitle">Edit Tool</h1>
    </div>
    <a href="/admin/tools">← Back to Tools</a>
  </div>

  <div class="container">
    <div class="loading" id="loading">Loading...</div>

    <form id="toolForm" style="display:none">
      <div class="form-card">
        <div class="row">
          <div class="form-group">
            <label for="number">Tool Number</label>
            <input type="number" id="number" name="number" min="1">
          </div>
          <div class="form-group">
            <label for="partner">Partner</label>
            <select id="partner" name="partner">
              <option value="ACEEU">ACEEU</option>
              <option value="EUEI">EUEI</option>
              <option value="TVW">TVW</option>
              <option value="MMS">MMS</option>
              <option value="UNEAT">UNEAT</option>
              <option value="MC">MC</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="image">Image</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="text" id="image" name="image" placeholder="/assets/images/1.jpg" style="flex:1;">
            <button type="button" class="btn btn-secondary" style="padding:8px 12px;" onclick="openFilePicker('image')">Browse</button>
          </div>
        </div>

        <div class="form-group">
          <label for="purpose">Purpose</label>
          <input type="text" id="purpose" name="purpose" list="purpose-suggestions" placeholder="Enter or select purpose">
          <datalist id="purpose-suggestions"></datalist>
        </div>

        <div class="form-group">
          <label for="summary">Summary</label>
          <textarea id="summary" name="summary" rows="2"></textarea>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4"></textarea>
        </div>

        <div class="form-group">
          <label for="outcomes">Outcomes</label>
          <textarea id="outcomes" name="outcomes" rows="4"></textarea>
        </div>

        <div class="form-group">
          <label for="instructions">Instructions</label>
          <textarea id="instructions" name="instructions" rows="4"></textarea>
        </div>

        <div class="form-group">
          <label for="benefits">Benefits</label>
          <textarea id="benefits" name="benefits" rows="2"></textarea>
        </div>

        <div class="form-group">
          <label for="prerequisiteTools">Prerequisite Tools</label>
          <textarea id="prerequisiteTools" name="prerequisiteTools" rows="3" placeholder="1. Tool Name"></textarea>
        </div>

        <div class="form-group">
          <label>Downloads</label>
          <div class="links-container" id="linksContainer">
            <!-- Links will be added here -->
          </div>
          <button type="button" class="btn btn-secondary add-link" onclick="addLink()">+ Add Download</button>
        </div>

        <div class="btn-group">
          <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
          <button type="button" class="btn btn-secondary" onclick="window.location.href='/admin/tools'">Cancel</button>
          <button type="button" class="btn btn-danger" id="deleteBtn" style="margin-left:auto;display:none">Delete</button>
        </div>
      </div>
    </form>
    <div class="error" id="error"></div>
    <div class="success" id="success">Saved successfully!</div>
  </div>

  <script>
    const lang = window.location.pathname.split('/')[3];
    const filename = window.location.pathname.split('/')[4];
    const isNew = filename === 'new';
    let links = [];

    const purposes = {
      en: [
        'Entrepreneurial Awareness & Sensitization',
        'Entrepreneurial Vision & Institutional Commitment',
        'Staff & Faculty Motivation, Incentives & Recognition',
        'Fostering an Entrepreneurial Mindset & Culture',
        'Entrepreneurship Education Planning & Financing',
        'Sustainable & Impact-Driven Entrepreneurship',
        'Continuous Innovation in Entrepreneurship Education'
      ],
      es: [
        'Conciencia & Sensibilización Emprendedora',
        'Visión Emprendedora & Compromiso Institucional',
        'Motivación, Incentivos & Reconocimiento para Personal & Profesores',
        'Fomento de una Mentalidad & Cultura Emprendedora',
        'Planificación & Financiación de la Educación Emprendedora',
        'Emprendimiento Sostenible & Orientado al Impacto',
        'Innovación Continua en la Educación Emprendedora'
      ],
      de: [
        'Unternehmerisches Bewusstsein & Sensibilisierung',
        'Unternehmerische Vision & institutionelles Engagement',
        'Motivation, Anreize & Anerkennung für Personal & Lehrkräfte',
        'Förderung einer unternehmerischen Denkweise & Kultur',
        'Planung & Finanzierung der Gründungsausbildung',
        'Nachhaltiges & wirkungsorientiertes Unternehmertum',
        'Kontinuierliche Innovation in der Gründungsausbildung'
      ],
      el: [
        'Επιχειρηματική Ευαισθητοποίηση & Ευαισθητοποίηση',
        'Επιχειρηματικό Όραμα & Θεσμική Δέσμευση',
        'Παρακίνηση, Κίνητρα & Αναγνώριση Προσωπικού & Καθηγητών',
        'Καλλιέργεια Επιχειρηματικής Νοοτροπίας & Πολιτισμού',
        'Σχεδιασμός & Χρηματοδότηση Επιχειρηματικής Εκπαίδευσης',
        'Βιώσιμη & Οδηγούμενη από τον Αντίκτυπο Επιχειρηματικότητα',
        'Συνεχής Καινοτομία στην Επιχειρηματική Εκπαίδευση'
      ]
    };

    function populatePurposeSuggestions() {
      const datalist = document.getElementById('purpose-suggestions');
      const langPurposes = purposes[lang] || purposes.en;
      datalist.innerHTML = langPurposes.map(p => `<option value="${escapeAttr(p)}">`).join('');
    }

    // Check auth
    async function checkAuth() {
      const res = await fetch('/api/auth/me');
      if (!res.ok) {
        window.location.href = '/admin';
        return false;
      }
      return true;
    }

    // Load tool data
    async function loadTool() {
      populatePurposeSuggestions();
      
      if (isNew) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('toolForm').style.display = 'block';
        document.getElementById('pageTitle').textContent = 'Create New Tool';
        document.getElementById('deleteBtn').style.display = 'none';
        addLink(); // Start with one empty link
        return;
      }

      try {
        const res = await fetch(`/api/tools/${lang}/${encodeURIComponent(filename)}`);
        if (!res.ok) throw new Error('Tool not found');
        
        const tool = await res.json();
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('toolForm').style.display = 'block';
        document.getElementById('pageTitle').textContent = `Edit: ${tool.name}`;
        document.getElementById('deleteBtn').style.display = 'block';

        // Fill form
        document.getElementById('number').value = tool.number || '';
        document.getElementById('name').value = tool.name || '';
        document.getElementById('image').value = tool.image || '';
        document.getElementById('purpose').value = tool.purpose || '';
        document.getElementById('summary').value = tool.summary || '';
        document.getElementById('description').value = tool.description || '';
        document.getElementById('outcomes').value = tool.outcomes || '';
        document.getElementById('instructions').value = tool.instructions || '';
        document.getElementById('benefits').value = tool.benefits || '';
        document.getElementById('prerequisiteTools').value = tool.prerequisiteTools || '';
        document.getElementById('partner').value = tool.partner || 'ACEEU';

        // Links
        links = tool.links || [];
        renderLinks();

      } catch (err) {
        document.getElementById('loading').textContent = err.message;
      }
    }

    // Render links
    function renderLinks() {
      const container = document.getElementById('linksContainer');
      container.innerHTML = links.map((link, i) => `
        <div class="link-row" data-index="${i}">
          <input type="text" placeholder="Title" value="${escapeAttr(link.title || '')}" onchange="updateLink(${i}, 'title', this.value)">
          <div style="display:flex;gap:4px;flex:1;">
            <input type="text" placeholder="/assets/tools/${lang}/file.pdf" value="${escapeAttr(link.url || '')}" onchange="updateLink(${i}, 'url', this.value)" style="flex:1;">
            <button type="button" class="btn btn-secondary" style="padding:8px;" onclick="openFilePickerForLink(${i})">📁</button>
          </div>
          <button type="button" class="btn btn-danger btn-small" onclick="removeLink(${i})">×</button>
        </div>
      `).join('');
      
      if (links.length === 0) {
        container.innerHTML = '<em style="color:#999">No downloads</em>';
      }
    }

    function addLink() {
      links.push({ title: '', url: '' });
      renderLinks();
    }

    function updateLink(index, field, value) {
      links[index][field] = value;
    }

    function removeLink(index) {
      links.splice(index, 1);
      renderLinks();
    }

    function escapeAttr(text) {
      return text.replace(/"/g, '&quot;');
    }

    // Save form
    document.getElementById('toolForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';
      
      const data = {
        number: parseInt(document.getElementById('number').value) || 1,
        name: document.getElementById('name').value,
        image: document.getElementById('image').value,
        purpose: document.getElementById('purpose').value,
        summary: document.getElementById('summary').value,
        description: document.getElementById('description').value,
        outcomes: document.getElementById('outcomes').value,
        instructions: document.getElementById('instructions').value,
        benefits: document.getElementById('benefits').value,
        prerequisiteTools: document.getElementById('prerequisiteTools').value,
        partner: document.getElementById('partner').value,
        links: links.filter(l => l.title && l.url)
      };

      try {
        let res;
        if (isNew) {
          res = await fetch(`/api/tools/${lang}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
        } else {
          res = await fetch(`/api/tools/${lang}/${encodeURIComponent(filename)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
        }

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'Save failed');
        }
        
        const toolNumber = document.getElementById('number').value;
        const previewUrl = `https://sdsp.jel.do/#/tool/${toolNumber}`;
        document.getElementById('success').innerHTML = `Saved! <a href="${previewUrl}" target="_blank">View tool on sdsp.jel.do</a>`;
        document.getElementById('success').style.display = 'block';
        document.getElementById('error').style.display = 'none';
        btn.textContent = 'Saved';
        btn.disabled = true;

      } catch (err) {
        document.getElementById('error').textContent = err.message;
        document.getElementById('error').style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Save';
      }
    });

    // Delete
    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if (!confirm('Are you sure you want to delete this tool?')) return;
      
      try {
        const res = await fetch(`/api/tools/${lang}/${encodeURIComponent(filename)}`, {
          method: 'DELETE'
        });
        
        if (!res.ok) throw new Error('Delete failed');
        window.location.href = `/admin/tools?lang=${lang}`;
      } catch (err) {
        alert(err.message);
      }
    });

    // Init
    checkAuth().then(ok => {
      if (ok) loadTool();
    });

    // File picker
    let targetField = null;
    let targetLinkIndex = null;

    function openFilePicker(field) {
      targetField = field;
      targetLinkIndex = null;
      document.getElementById('filePickerModal').classList.add('show');
      document.getElementById('filePickerPath').value = '';
      loadFiles('/assets/');
    }

    function openFilePickerForLink(index) {
      targetField = 'url';
      targetLinkIndex = index;
      document.getElementById('filePickerModal').classList.add('show');
      document.getElementById('filePickerPath').value = '';
      loadFiles(`/assets/tools/${lang}/`);
    }

    function closeFilePicker() {
      document.getElementById('filePickerModal').classList.remove('show');
    }

    async function loadFiles(folder) {
      const container = document.getElementById('fileList');
      container.innerHTML = '<p style="padding:20px;color:#666;">Loading...</p>';
      
      try {
        const res = await fetch(`/api/files/files?folder=${encodeURIComponent(folder.replace('/assets/', ''))}`);
        const data = await res.json();
        
        let html = '';
        
        // Breadcrumb
        const parts = folder.replace('/assets/', '').split('/').filter(Boolean);
        let breadcrumb = '/assets/';
        html += `<div style="padding:10px;border-bottom:1px solid #e7f4d3;">
          <a href="#" onclick="loadFiles('/assets/');return false;" style="color:#2d9f88;">/assets</a>`;
        for (let i = 0; i < parts.length; i++) {
          breadcrumb += parts[i] + '/';
          html += ` / <a href="#" onclick="loadFiles('${breadcrumb}');return false;" style="color:#2d9f88;">${parts[i]}</a>`;
        }
        html += '</div>';
        
        // Folders
        for (const f of data.folders || []) {
          const fullPath = folder + f.name + '/';
          html += `<div class="file-item folder" onclick="loadFiles('${fullPath}')">
            <span>📁</span> ${f.name}/
          </div>`;
        }
        
        // Files
        for (const f of data.files || []) {
          const isImage = /\.(jpg|jpeg|png|gif|svg|webp)$/i.test(f.name);
          const icon = isImage ? '🖼️' : '📄';
          html += `<div class="file-item" onclick="selectFile('${f.path}')">
            <span>${icon}</span> ${f.name}
          </div>`;
        }
        
        if (html === '') {
          html = '<p style="padding:20px;color:#999;">Empty folder</p>';
        }
        
        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = '<p style="padding:20px;color:#c00;">Failed to load files</p>';
      }
    }

    function selectFile(path) {
      if (targetLinkIndex !== null) {
        updateLink(targetLinkIndex, 'url', path);
        renderLinks();
      } else if (targetField) {
        document.getElementById(targetField).value = path;
      }
      closeFilePicker();
    }

    async function uploadFile() {
      const input = document.getElementById('fileInput');
      if (!input.files[0]) return;
      
      const file = input.files[0];
      const folder = document.getElementById('filePickerPath').value || '';
      const formData = new FormData();
      formData.append('file', file);
      
      const btn = document.getElementById('uploadBtn');
      btn.disabled = true;
      btn.textContent = 'Uploading...';
      
      try {
        const res = await fetch(`/api/files/upload?folder=${encodeURIComponent(folder)}`, {
          method: 'POST',
          credentials: 'include',
          body: formData
        });
        
        if (!res.ok) throw new Error('Upload failed');
        
        const data = await res.json();
        selectFile(data.path);
        input.value = '';
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Upload';
      }
    }
  </script>

  <!-- File Picker Modal -->
  <style>
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: white;
      border-radius: 16px;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .modal-header {
      padding: 20px;
      border-bottom: 2px solid #e7f4d3;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { margin: 0; color: #1d524a; }
    .modal-body {
      max-height: 400px;
      overflow-y: auto;
    }
    .file-item {
      padding: 12px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #f5faeb;
    }
    .file-item:hover { background: #f5faeb; }
    .file-item.folder { color: #5c8c24; }
    .modal-footer {
      padding: 20px;
      border-top: 2px solid #e7f4d3;
    }
    .upload-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #999;
    }
    .close-btn:hover { color: #333; }
  </style>
  <div class="modal" id="filePickerModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Select File</h3>
        <button class="close-btn" onclick="closeFilePicker()">×</button>
      </div>
      <div class="modal-body" id="fileList"></div>
      <div class="modal-footer">
        <div class="upload-row">
          <input type="file" id="fileInput" style="flex:1;">
          <input type="text" id="filePickerPath" placeholder="Folder (e.g. tools/en)" style="width:150px;">
          <button id="uploadBtn" class="btn btn-primary" style="padding:10px 16px;" onclick="uploadFile()">Upload</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
